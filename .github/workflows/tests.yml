name: tests

on:
  push:
  pull_request:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    # PostgreSQL — для проверки, что приложение готово к переезду базы (tests/test_social.py)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pn_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run editorial system checks
        run: python tests/test_editorial_full_pipeline.py
      - name: Run full legacy regression suite
        run: python tests/run_tests.py
      - name: Run anonymous question checks
        run: python tests/test_anonymous_questions.py
      - name: Run anonymous reply publication checks
        run: python tests/test_anonymous_replies.py
      - name: Run smart ad reminder checks
        run: python tests/test_smart_ad_material_reminders.py
      - name: Run admin-gated ad reminder checks
        run: python tests/test_admin_gated_ad_reminders.py
      - name: Run 72h email preview checks
        run: python tests/test_72h_email_preview.py
      - name: Run Gmail OAuth checks
        run: python tests/test_gmail_oauth_runtime.py
      - name: Run Q4 advertising campaign checks
        run: python tests/test_ads_q4_campaign.py
      - name: Run ads cleanup and welcome email checks
        run: python tests/test_ads_cleanup_runtime.py
      - name: Run Instagram Direct sales agent checks
        run: python tests/test_instagram_sales_agent.py
      - name: Run Contact Guide web checkout checks
        run: python tests/test_contact_guide_web_checkout.py
      - name: Run Admin Center newsletter subscribers checks
        run: python tests/test_admin_newsletter_subscribers.py
      - name: Run admin publishing channel checks
        run: python tests/test_admin_channels.py
      - name: Run bot navigation, inbox, menu, NS, afisha and app checks (app also on PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pn_test
        run: python -m unittest tests.test_nav_guard tests.test_inbox tests.test_menu_card tests.test_story_media tests.test_ns_trains tests.test_ns_alerts tests.test_afisha_site tests.test_newsletter_emails tests.test_card_email_reminders tests.test_content_frequency tests.test_savings tests.test_app_api tests.test_community tests.test_market tests.test_dm tests.test_calendar_shop tests.test_tax_guide_web tests.test_social tests.test_feed tests.test_app_market tests.test_pulse_stories tests.test_geo_billing
