name: tests

on:
  push:
  pull_request:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Diagnose editorial morning binding
        run: |
          python - <<'PY'
          import inspect
          from utils import editorial_channel as editorial
          from utils import editorial_websearch_fix as webfix
          from utils import editorial_verified_search as verified
          from utils import editorial_budget_photo as budget
          webfix.install_editorial_websearch_fix()
          budget.install_editorial_budget_photo()
          verified.install_editorial_verified_search()
          source = inspect.getsource(editorial._morning_brief)
          print('MODULE:', editorial._morning_brief.__module__)
          print('NAME:', editorial._morning_brief.__name__)
          print('HAS_POLICY:', '1100-2000 знаков' in source)
          print(source)
          PY
      - name: Run editorial system checks
        run: python tests/test_editorial_full_pipeline.py
      - name: Run full legacy regression suite
        run: python tests/run_tests.py
      - name: Run anonymous question checks
        run: python tests/test_anonymous_questions.py
      - name: Run anonymous reply publication checks
        run: python tests/test_anonymous_replies.py
      - name: Run smart ad reminder checks
        run: python tests/test_smart_ad_material_reminders.py
      - name: Run admin-gated ad reminder checks
        run: python tests/test_admin_gated_ad_reminders.py
      - name: Run 72h email preview checks
        run: python tests/test_72h_email_preview.py
      - name: Run Gmail OAuth checks
        run: python tests/test_gmail_oauth_runtime.py
      - name: Run Q4 advertising campaign checks
        run: python tests/test_ads_q4_campaign.py
