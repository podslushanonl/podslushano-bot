img{display:block;max-width:100%}
.blob{position:fixed;border-radius:50%;filter:blur(60px);opacity:.55;z-index:0;pointer-events:none;will-change:transform}
.b1{width:420px;height:420px;background:#FFC2A1;left:-140px;top:-120px;animation:drift1 18s ease-in-out infinite}
.b2{width:380px;height:380px;background:#B9D6FF;right:-160px;top:220px;animation:drift2 22s ease-in-out infinite}
.b3{width:360px;height:360px;background:#C8F0D6;left:-120px;top:780px;animation:drift1 26s ease-in-out infinite reverse}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .blob{opacity:.18}}
:root[data-theme="dark"] .blob{opacity:.18}
@keyframes drift1{50%{transform:translate(60px,40px) scale(1.1)}}
@keyframes drift2{50%{transform:translate(-50px,60px) scale(.92)}}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
.glass{background:var(--glass);border:1px solid var(--brd);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 24px 50px -34px rgba(20,25,40,.5)}
.in{opacity:0;transform:translateY(16px) scale(.98);animation:rise .7s var(--ease) forwards;animation-delay:calc(var(--d,0) * 70ms)}
@keyframes rise{to{opacity:1;transform:none}}
/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chipw{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;font:600 13px var(--f)}
.chipw i{width:7px;height:7px;border-radius:50%;background:#1DB954;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(29,185,84,.5)}70%{box-shadow:0 0 0 8px rgba(29,185,84,0)}100%{box-shadow:0 0 0 0 rgba(29,185,84,0)}}
.thm{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.thm svg{width:18px;height:18px}
/* hero */
.hero{margin-top:14px;border-radius:30px;padding:22px 20px 18px;position:relative;overflow:hidden}
.hero .lg{width:190px;height:auto;border-radius:14px}
:root[data-theme="dark"] .hero .lg{background:#fff;padding:8px 10px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero .lg{background:#fff;padding:8px 10px}}
.hero h1{font:700 21px/1.2 var(--f);letter-spacing:-.01em;margin-top:12px;max-width:22ch}
.hero p{color:var(--muted);font-size:14px;margin-top:4px}
.moose{position:absolute;right:6px;bottom:-6px;height:132px;width:auto;animation:peek 5s ease-in-out infinite;transform-origin:bottom center;filter:drop-shadow(0 10px 12px rgba(30,40,70,.2))}
@keyframes peek{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg) translateY(-3px)}}
.stats{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap;max-width:calc(100% - 92px)}
.stat{display:flex;align-items:center;gap:7px;padding:6px 10px 6px 6px;border-radius:14px;background:rgba(255,255,255,.7);border:1px solid rgba(13,17,23,.06)}
:root[data-theme="dark"] .stat{background:rgba(255,255,255,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stat{background:rgba(255,255,255,.06)}}
.stat .bi{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;color:#fff}
.stat .bi svg{width:13px;height:13px;fill:currentColor}
.stat b{font:700 15px var(--f)}
/* section heads */
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:26px 4px 10px}
.sh h2{font:700 18px var(--f);letter-spacing:-.01em}
.sh a,.sh span{font:600 13px var(--f);color:var(--muted)}
/* app icons */
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
.app{display:grid;justify-items:center;gap:7px;text-align:center}
.ic{position:relative;width:76px;height:76px;border-radius:24px;display:grid;place-items:center;overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 -2px 0 rgba(0,0,0,.12) inset,0 14px 24px -12px var(--sh,rgba(20,25,40,.45));transition:transform .45s var(--spring);animation:float 6s ease-in-out infinite;animation-delay:calc(var(--d,0) * -.7s)}
.ic::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0) 48%);pointer-events:none;z-index:2}
.ic::after{content:"";position:absolute;top:-60%;left:-80%;width:60%;height:220%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:rotate(20deg);animation:shine 7s ease-in-out infinite;animation-delay:calc(var(--d,0) * .6s + 1s);z-index:3;pointer-events:none}
@keyframes shine{0%,78%{left:-80%}92%,100%{left:140%}}
@keyframes float{50%{transform:translateY(-4px)}}
.app:active .ic{transform:scale(.9)}
@media (hover:hover){.app:hover .ic{transform:translateY(-4px) scale(1.04)}}
.ic svg.g{width:40px;height:40px;position:relative;z-index:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.18))}
.ic img{position:relative;z-index:1}
.app b{font:700 13px/1.15 var(--f)}
.app small{font-size:11.5px;color:var(--muted);line-height:1.25;max-width:13ch}
/* partner spotlight */
.spot{border-radius:28px;position:relative;padding:2px;overflow:hidden;isolation:isolate}
.spot::before{content:"";position:absolute;inset:-50%;background:conic-gradient(from var(--a,0deg),#FF5A1F,#FFB48E,#9AD4FF,#7CE0A8,#FF5A1F);animation:spin 6s linear infinite;z-index:-1}
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes spin{to{--a:360deg}}
.spot-in{border-radius:26px;background:var(--bg);overflow:hidden;position:relative}
.slides{display:grid}
.slide{grid-area:1/1;opacity:0;transform:translateX(20px);transition:opacity .5s var(--ease),transform .6s var(--ease);pointer-events:none;padding:18px;display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:center}
.slide.on{opacity:1;transform:none;pointer-events:auto}
.slide .pl{width:72px;height:72px;border-radius:20px;overflow:hidden;box-shadow:0 10px 20px -10px rgba(0,0,0,.4)}
.slide .pl img{width:100%;height:100%;object-fit:cover}
.adtag{display:inline-flex;gap:6px;align-items:center;font:700 10px var(--f);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.adtag em{font-style:normal;padding:2px 7px;border-radius:6px;background:rgba(13,17,23,.06);color:var(--ink-2)}
.slide h3{font:700 17px/1.2 var(--f);margin-top:4px}
.slide p{font-size:13.5px;color:var(--ink-2);margin-top:4px;line-height:1.4}
.cta{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:9px 14px;border-radius:12px;font:700 13px var(--f);background:var(--ink);color:var(--bg);transition:transform .3s var(--spring)}
.cta:active{transform:scale(.95)}
.cta svg{width:14px;height:14px}
.bars{display:flex;gap:5px;padding:0 18px 14px}
.bars i{flex:1;height:3px;border-radius:3px;background:rgba(13,17,23,.1);overflow:hidden}
.bars i b{display:block;height:100%;background:var(--accent);transform:scaleX(0);transform-origin:left}
.bars i.done b{transform:scaleX(1)}
.bars i.run b{animation:bar 5.5s linear forwards}
@keyframes bar{to{transform:scaleX(1)}}
/* posters */
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 14px;margin:0 -16px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.pst{flex:0 0 168px;scroll-snap-align:start;border-radius:22px;overflow:hidden;position:relative;aspect-ratio:3/4.2;background:#111;color:#fff;box-shadow:0 20px 34px -22px rgba(0,0,0,.6);transition:transform .45s var(--spring)}
.pst:active{transform:scale(.96)}
.pst img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pst::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.85))}
.pst .dt{position:absolute;left:10px;top:10px;z-index:1;background:#fff;color:#0D1117;border-radius:12px;padding:5px 8px;text-align:center;font:700 17px/1 var(--f)}
.pst .dt small{display:block;font:700 9px var(--f);color:#6A7280;margin-top:2px;text-transform:uppercase}
.pst .tx{position:absolute;left:12px;right:12px;bottom:12px;z-index:1;display:grid;gap:3px}
.pst .tx b{font:700 15px/1.15 var(--f)}
.pst .tx small{font-size:11.5px;opacity:.85}
.pst .tx span{margin-top:6px;justify-self:start;font:700 11.5px var(--f);padding:6px 10px;border-radius:10px;background:var(--accent);color:#fff}
.pst.all{background:linear-gradient(160deg,#FF8A4C,#D9440D);display:grid;place-items:center;text-align:center;padding:16px}
.pst.all::after{display:none}
.pst.all b{font:700 18px/1.2 var(--f)}
/* list cards */
.lst{border-radius:24px;overflow:hidden}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid rgba(13,17,23,.06);transition:background .2s}
.row:first-child{border-top:0}
.row:active{background:rgba(13,17,23,.04)}
.row .th{width:52px;height:52px;border-radius:14px;overflow:hidden;background:#ddd}
.row .th img{width:100%;height:100%;object-fit:cover}
.row b{font:700 14px/1.25 var(--f);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row small{font-size:12px;color:var(--muted)}
.row svg.ar{width:16px;height:16px;color:var(--muted)}
.trio{display:grid;gap:10px}
.tc{border-radius:24px;padding:16px;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center}
.tc .ic{width:48px;height:48px;border-radius:15px;animation:none}
.tc .ic svg.g{width:24px;height:24px}
.tc b{font:700 15px var(--f)}
.tc small{display:block;font-size:12.5px;color:var(--muted);line-height:1.35}
.tc svg.ar{width:18px;height:18px;color:var(--muted)}
/* socials */
.soc{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.so{display:grid;justify-items:center;gap:5px;padding:12px 4px;border-radius:20px;font:700 12px var(--f)}
.so .bi{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff;transition:transform .4s var(--spring)}
.so:active .bi{transform:scale(.9)}
.so .bi svg{width:20px;height:20px;fill:currentColor}
.so small{font-size:10.5px;color:var(--muted);font-weight:600}
.ft{text-align:center;margin-top:26px;font-size:12px;color:var(--muted);display:grid;gap:6px}
.ft a{text-decoration:underline;text-underline-offset:3px}
.b-ig{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%)}.b-tg{background:#26A5E4}.b-fb{background:#0866FF}.b-tt{background:#111}.b-yt{background:#FF0000}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.in{opacity:1;transform:none}}
@media (min-width:600px){.apps{grid-template-columns:repeat(3,1fr)}.pst{flex-basis:190px}}
</style>
</head>

  $('#slides').innerHTML=L.map((p,i)=>`<div class="slide${i?'':' on'}"><span class="pl"><img src="${p.img}" alt="${esc(p.name)}"></span><div><span class="adtag"><em>Партнёр</em>${esc(p.name)}</span><h3>${esc(p.title)}</h3><p>${esc(p.text)}</p><a class="cta" href="${esc(utm(p.url,p.id))}" target="_blank" rel="noopener sponsored">${esc(p.cta)}${AR}</a></div></div>`).join('');
  $('#bars').innerHTML=L.length>1?L.map(()=>'<i><b></b></i>').join(''):'';
  let k=0,t=null;const S=[...document.querySelectorAll('.slide')],B=[...document.querySelectorAll('#bars i')];
  const go=n=>{k=(n+L.length)%L.length;S.forEach((s,j)=>s.classList.toggle('on',j===k));B.forEach((b,j)=>{b.className=j<k?'done':j===k?'run':'';const bb=b.firstChild;bb.style.animation='none';void bb.offsetWidth;bb.style.animation=''});clearTimeout(t);if(L.length>1&&!RM)t=setTimeout(()=>go(k+1),5500)};
  let sx=null;const sp=$('.spot');sp.addEventListener('pointerdown',e=>sx=e.clientX);sp.addEventListener('pointerup',e=>{if(sx!=null&&Math.abs(e.clientX-sx)>40)go(k+(e.clientX<sx?1:-1));sx=null});go(0)})();
/* events */
const evs=EVENTS.filter(e=>e.d>=iso);
$('#rail').innerHTML=evs.map(e=>{const [y,m,d]=e.d.split('-');return `<a class="pst" href="${esc(e.url)}" target="_blank" rel="noopener sponsored"><img src="${e.img}" alt="" style="object-position:${e.pos||'center'}"><span class="dt">${+d}<small>${MS[+m-1]}</small></span><span class="tx"><b>${esc(e.h)}</b><small>${esc(e.s)}</small><span>Билеты</span></span></a>`}).join('')+`<a class="pst all" href="${SITE}/events/"><b>Вся афиша<br>на сайте</b></a>`;
/* news */
